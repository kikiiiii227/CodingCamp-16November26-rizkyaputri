<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Header & Greeting -->
        <header class="top-header">
            <div class="header-left">
                <h2 id="greeting-text">Welcome, <span id="user-name">Rizkya</span></h2>
                <button id="edit-name-btn" class="btn-ghost" title="Edit Name">✏️ Edit Name</button>
            </div>

            <div class="header-right">
                <div class="datetime-group">
                    <span id="clock">00:00:00</span>
                    <span id="date">Loading date...</span>
                </div>
                <button id="theme-toggle" class="btn-theme">🌙 Dark</button>
            </div>
        </header>

        <!-- Focus Timer -->
        <section class="timer-banner">
            <div class="timer-info">
                <span class="badge">FOCUS SESSION</span>
                <div id="timer-display">25:00</div>
            </div>

            <div class="timer-controls">
                <button id="start-btn" class="btn-secondary">▶ Start</button>
                <button id="stop-btn" class="btn-secondary">⏸ Stop</button>
                <button id="reset-btn" class="btn-secondary">↺ Reset</button>
            </div>

            <div class="timer-setting">
                <label for="custom-minutes">Minutes:</label>
                <input type="number" id="custom-minutes" min="1" max="120" value="25">
                <button id="set-timer-btn" class="btn-secondary">Set</button>
            </div>
        </section>

        <!-- To-Do List -->
        <main class="workspace-tasks">
            <div class="workspace-header">
                <h3>Task List</h3>
                <select id="sort-tasks">
                    <option value="default">Sort: Latest</option>
                    <option value="az">Name (A - Z)</option>
                    <option value="za">Name (Z - A)</option>
                    <option value="incomplete">Pending First</option>
                    <option value="completed">Completed First</option>
                </select>
            </div>

            <form id="task-form">
                <input type="text" id="task-input" placeholder="Add a new task and press Enter..." required>
                <button type="submit" class="btn-primary">+ Add</button>
            </form>

            <ul id="task-list"></ul>
        </main>

        <!-- Quick Links -->
        <footer class="links-dock">
            <div class="dock-header">
                <h3>Quick Links</h3>
                <form id="link-form">
                    <input type="text" id="link-name" placeholder="Site name" required>
                    <input type="url" id="link-url" placeholder="https://..." required>
                    <button type="submit" class="btn-primary">+ Link</button>
                </form>
            </div>

            <div id="links-container"></div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
